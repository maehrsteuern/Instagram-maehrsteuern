name: Lage
# Schreibt LAGE.md + LAGE.html neu (automatik/lage.py): nach jedem Push, nach jedem Lauf der anderen Abläufe und jeden Morgen.
# LAGE.html geht als grafische Lage-Seite auf GitHub Pages (Job „seite“, nur wenn sich etwas geändert hat).
# Gleicht außerdem die Termine aus dem Plan mit dem Google-Kalender „maehrsteuern Autopilot“ ab
# (automatik/kalender_sync.py, Dienstkonto, nur dieser Kalender).
# Committet nur, wenn sich wirklich etwas geändert hat.
on:
  push:
    branches: [claude/instagram]
    paths-ignore: [LAGE.md, LAGE.html]
  workflow_run:
    workflows: ["Instagram posten", "Freigabe", "Instagram-Statistik", "Instagram-Schlüssel verlängern", "Musik holen"]
    types: [completed]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
concurrency:
  # eigene Gruppe: nicht in instagram-plan, sonst könnte ein wartender Posten-Lauf verdrängt werden
  group: lage
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
  issues: write
jobs:
  lage:
    runs-on: ubuntu-24.04
    outputs:
      neu: ${{ steps.speichern.outputs.neu }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/instagram
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automatik/requirements-google.txt
      - name: Tagesstatistik anstoßen (08:40–10:00 Uhr, falls heute noch keine)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          uhr=$(TZ=Europe/Berlin date +%H%M); heute=$(TZ=Europe/Berlin date +%F)
          [ "$uhr" -ge 840 ] && [ "$uhr" -lt 1000 ] || exit 0
          git fetch -q origin claude/instagram
          git show origin/claude/instagram:automatik/statistik/konto.csv 2>/dev/null | grep -q "^$heute," && exit 0
          laeufe=$(gh run list --workflow statistik.yml --created ">=$(date -u -d '-30 minutes' +%FT%TZ)" --json databaseId --jq length)
          [ "$laeufe" = 0 ] && gh workflow run statistik.yml --ref claude/instagram && echo "Statistik gestartet" || true
      - name: Radar anstoßen (07:00–10:00 Uhr, falls heute noch keiner lief)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          uhr=$(TZ=Europe/Berlin date +%H%M); mitternacht=$(date -u -d "$(TZ=Europe/Berlin date +%F) 00:00 $(TZ=Europe/Berlin date +%z)" +%FT%TZ)
          [ "$uhr" -ge 700 ] && [ "$uhr" -lt 1000 ] || exit 0
          laeufe=$(gh run list --workflow radar.yml --created ">=$mitternacht" --json databaseId --jq length)
          [ "$laeufe" = 0 ] && gh workflow run radar.yml --ref claude/instagram && echo "Radar gestartet" || true
      - name: Wochenbericht anstoßen (So 18:00–21:00 Uhr, falls heute noch keiner lief)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [ "$(TZ=Europe/Berlin date +%u)" = 7 ] || exit 0
          uhr=$(TZ=Europe/Berlin date +%H%M); mitternacht=$(date -u -d "$(TZ=Europe/Berlin date +%F) 00:00 $(TZ=Europe/Berlin date +%z)" +%FT%TZ)
          [ "$uhr" -ge 1800 ] && [ "$uhr" -lt 2100 ] || exit 0
          laeufe=$(gh run list --workflow wochenbericht.yml --event workflow_dispatch --created ">=$mitternacht" --json databaseId --jq length)
          [ "$laeufe" = 0 ] && gh workflow run wochenbericht.yml --ref claude/instagram && echo "Wochenbericht gestartet" || true
      - name: Schlüssel verlängern anstoßen (Reserve, falls der Monatslauf ausfiel – < 30 Tage, max. 1× am Tag)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          rest=$(python3 -c "import json, datetime as d; a = json.load(open('automatik/schluessel_ablauf.json')); print(min((d.date.fromisoformat(a[k]) - d.date.today()).days for k in ('IG_TOKEN', 'FB_TOKEN') if k in a))" 2>/dev/null || echo 99)
          [ "$rest" -lt 30 ] || exit 0
          laeufe=$(gh run list --workflow token.yml --created ">=$(date -u -d '-1 day' +%FT%TZ)" --json databaseId --jq length)
          [ "$laeufe" = 0 ] && gh workflow run token.yml --ref claude/instagram && echo "Schlüssel-Verlängerung gestartet (noch $rest Tage)" || true
      - name: Wächter (ein Issue, meldet sich nur bei Problemen)
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python automatik/waechter.py
      - name: Schreiben und speichern
        id: speichern
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "Loris M." && git config user.email "mkwloris@googlemail.com"
          for versuch in 1 2 3 4; do
            git pull -q --rebase origin claude/instagram
            python automatik/lage.py
            git add LAGE.md LAGE.html
            git diff --cached --quiet && exit 0
            git commit -q -m "Lage aktualisiert"
            git push -q origin HEAD:claude/instagram && echo "neu=1" >> "$GITHUB_OUTPUT" && exit 0
            git reset -q --hard origin/claude/instagram
            sleep $((versuch * 5))
          done
          exit 1
      - name: Google-Kalender „maehrsteuern Autopilot“ abgleichen
        # auch wenn LAGE.md nicht gepusht werden konnte – der Kalender hängt nicht daran
        if: ${{ !cancelled() }}
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          pip install -q -r automatik/requirements-google.txt
          python automatik/kalender_sync.py

  seite:
    # LAGE.html → GitHub Pages (index.html). Nur bei neuer Lage, nach einem Push von Hand/Claude oder von Hand gestartet.
    needs: lage
    if: ${{ !cancelled() && (needs.lage.outputs.neu == '1' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: lage-seite
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/instagram
      - name: Seite zusammenstellen
        run: mkdir _site && cp LAGE.html _site/index.html && touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
