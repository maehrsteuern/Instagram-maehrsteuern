name: Radar
# Daily in the morning: work list for commenting/DMs/collabs as an issue (automation/radar.py)
# and LinkedIn packages for approved carousels (automation/linkedin.py – off unless enabled in interaction.json).
# Never posts or writes by itself. Main trigger is status.yml (7:00–10:00 AM ET, if no run today yet);
# the schedule here is the backup (UTC: 8:13 AM EDT / 7:13 AM EST).
on:
  schedule:
    - cron: "13 12 * * *"
  workflow_dispatch:
concurrency:
  group: radar
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  radar:
    if: github.repository == 'maehrsteuern/maehrtax---instagram'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -q requests pillow anthropic
      - run: git config user.name "Loris M." && git config user.email "mkwloris@googlemail.com"
      - name: Radar
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_IG_USER_ID: ${{ secrets.FB_IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python automation/radar.py
      - name: LinkedIn packages
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python automation/linkedin.py
