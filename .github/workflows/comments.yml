name: Comments
# After every post run (every 15 min): new comments under your own posts with a reply suggestion into the issue
# "💬 Reply to comments". Reply "C12 ok" / "C12 your own text" in the issue → posted as a reply.
# Never sends DMs – ManyChat does that. Comments with a ManyChat keyword are skipped.
on:
  workflow_run:
    workflows: ["Instagram post"]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  check:
    concurrency: { group: comments, cancel-in-progress: false }
    if: github.repository == 'maehrsteuern/maehrtax---instagram' && github.event_name != 'issue_comment'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -q requests anthropic
      - run: git config user.name "Loris M." && git config user.email "mkwloris@googlemail.com"
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python automation/comments.py check
  reply:
    # one group per comment: in a shared group a new comment pushes out a waiting run
    # (GitHub keeps only one) – its text would be lost. Parallel is fine: push with pull --rebase + retries.
    concurrency:
      group: comments-c${{ github.event.comment.id }}
      cancel-in-progress: false
    # only comments by the account owner in the comments issue
    if: >-
      github.repository == 'maehrsteuern/maehrtax---instagram' &&
      github.event_name == 'issue_comment' &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'comments')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - run: git config user.name "Loris M." && git config user.email "mkwloris@googlemail.com"
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ github.event.comment.body }}
        run: python automation/comments.py reply "$COMMENT"
