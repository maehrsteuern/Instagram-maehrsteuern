name: Instagram-Schlüssel verlängern
# Am 1. jedes Monats; ein Schlüssel gilt 60 Tage. Manuell startbar.
on:
  schedule:
    - cron: "27 4 1 * *"
  workflow_dispatch:
jobs:
  token:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python automatik/schluessel_verlaengern.py
      - name: Facebook-Schlüssel (Radar)
        if: always()
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python automatik/fb_schluessel_verlaengern.py
