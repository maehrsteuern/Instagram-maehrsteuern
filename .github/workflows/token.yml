name: Instagram-Schlüssel verlängern
# Am 1. jedes Monats; ein Schlüssel gilt 60 Tage. Manuell startbar.
on:
  schedule:
    - cron: "27 4 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  token:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python automatik/schluessel_verlaengern.py
      - name: Facebook-Schlüssel (Radar)
        if: always()
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python automatik/fb_schluessel_verlaengern.py
      - name: Ablaufdaten speichern (für den Wächter, ohne Schlüssel)
        if: always()
        run: |
          git config user.name "Loris M." && git config user.email "mkwloris@googlemail.com"
          git add automatik/schluessel_ablauf.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "Schlüssel: Ablaufdaten aktualisiert"
          for versuch in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; sleep $((versuch * 5)); done
          exit 1
