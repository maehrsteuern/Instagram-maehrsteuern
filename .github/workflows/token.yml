name: Instagram-Schlüssel verlängern
# Am 1. jedes Monats; ein Schlüssel gilt 60 Tage. Manuell startbar.
on:
  schedule:
    - cron: "27 4 1 * *"
  workflow_dispatch:
jobs:
  token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python automatik/schluessel_verlaengern.py
