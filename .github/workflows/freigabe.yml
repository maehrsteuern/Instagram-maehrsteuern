name: Freigabe
# Neue Entwürfe in plan.json → Issue mit Vorschau. Antwort „go“/„stop“ im Issue → Status in plan.json.
on:
  push:
    branches: [claude/instagram]
    paths: [automatik/plan.json]
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  anfragen:
    # eigene Gruppe: in instagram-plan verdrängt der 15-Min.-Posten-Takt einen wartenden Freigabe-Lauf.
    # plan.json wird per pull --rebase zusammengeführt.
    concurrency: { group: freigabe, cancel-in-progress: false }
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: git config user.name "Loris M." && git config user.email "mkwloris@googlemail.com"
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 automatik/freigabe.py anfragen
  antwort:
    # je Kommentar eigene Gruppe: in einer gemeinsamen Gruppe verdrängt ein neuer Kommentar einen wartenden
    # Lauf (GitHub hält nur einen) – dessen Text ginge verloren. Parallel ist ok: Push mit pull --rebase + Wiederholung.
    concurrency:
      group: freigabe-c${{ github.event.comment.id }}
      cancel-in-progress: false
    # nur Kommentare des Konto-Inhabers in Freigabe-Issues
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'freigabe')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: git config user.name "Loris M." && git config user.email "mkwloris@googlemail.com"
      - env:
          GH_TOKEN: "${{ github.token }}"
          KOMMENTAR: "${{ github.event.comment.body }}"
        run: python3 automatik/freigabe.py antwort "${{ github.event.issue.number }}" "$KOMMENTAR"
