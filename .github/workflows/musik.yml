name: Musik holen
# Einmalig bzw. bei Bedarf: 5 gemeinfreie Titel (CC0) von FreePD nach musik/ holen.
on:
  workflow_dispatch:
concurrency:
  group: instagram-plan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  musik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests imageio-ffmpeg
      - run: python automatik/musik_holen.py
      - name: Speichern
        run: |
          git config user.name "Loris M." && git config user.email "mkwloris@googlemail.com"
          git add musik && git diff --cached --quiet || (git commit -m "Musik: gemeinfreie Titel von FreePD (CC0)" && git pull --rebase -q && git push)
