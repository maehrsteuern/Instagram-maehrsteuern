<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="text.js"></script>
<!--
Story 1080×1920 for @maehrtax. Top 250 px and bottom 340 px stay free (Instagram bars).
Data keys (text keys understand *green* and \n):
  type      string   "info" | "question" | "answer" | "teaser"                         (required)
                     question = leaves an empty slot for a poll/quiz/question sticker (added by hand in the app)
                     answer   = no sticker needed, can be posted automatically
                     teaser   = shows a post preview card + hint
  kicker    string   small mono line on top, e.g. "QUICK POLL"
  title     string   headline                                                           (required)
  text      string   body text
  points    string[] arrow list
  answer    string   highlighted answer box (type "answer"), default "↩ Reply to this story"
  slotHint  string   small line above the empty sticker slot (type "question"), e.g. "Vote below ↓"
  slot      number   height of the empty sticker slot in px (type "question"), default 380
  image     string   image for the teaser card (relative to this file), usually the post's slide_01.png.
                     Without it the card falls back to a plain branded card.
  hint      string   line under the teaser card, default "New on the profile → @maehrtax"
  photo     string   transparent cutout (relative to this file) shown large at the bottom (type "info")
  cta       boolean  show the CTA pill
  chip      string   text of the CTA pill, default '💬 DM “TOOL”'
-->
<style>
html,body{width:1080px;height:1920px}
body{background:radial-gradient(90% 55% at 50% 42%,var(--bg2) 0%,var(--bg) 70%)}
.pad{position:absolute;left:90px;right:90px;top:250px;bottom:340px;display:flex;flex-direction:column;justify-content:center}
.pad.withphoto{bottom:960px;justify-content:flex-start}
.kicker{font-size:32px}
h1{font-family:var(--serif);font-weight:600;font-size:104px;line-height:1.04;margin:36px 0 0}
.txt{font-size:42px;line-height:1.5;color:var(--text2);margin-top:44px}
ul{list-style:none;padding:0;margin:52px 0 0}
li{font-size:44px;line-height:1.35;margin:0 0 34px;padding-left:64px;position:relative}
li:last-child{margin-bottom:0}
li:before{content:"→";position:absolute;left:0;color:var(--gruen);font-family:var(--mono);font-weight:600}
.slothint{margin-top:64px;font-family:var(--mono);font-size:32px;color:var(--gruen);font-weight:600}
.slot{margin-top:24px;flex:none}
.answer{margin-top:64px;padding:40px 44px;border:3px solid var(--gruen);border-radius:36px;background:var(--gruen-soft);font-size:44px;line-height:1.4;color:var(--text)}
.card{margin:52px auto 0;width:620px;aspect-ratio:4/5;border-radius:32px;background:center/cover no-repeat;
  box-shadow:0 0 90px rgba(83,195,162,.28);border:3px solid var(--gruen);flex:none;overflow:hidden}
.card.plain{background:radial-gradient(110% 70% at 80% 0%,var(--bg2) 0%,var(--bg) 70%);display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:28px}
.card.plain b{font-family:var(--serif);font-size:84px;font-weight:600;color:var(--text)}
.card.plain span{font-family:var(--mono);font-size:30px;letter-spacing:.3em;color:var(--gruen)}
.hint{margin-top:40px;font-family:var(--mono);font-size:32px;color:var(--gruen);text-align:center;font-weight:600}
.handle{position:absolute;left:0;right:0;bottom:250px;text-align:center;font-family:var(--mono);font-size:30px;color:var(--grau)}
.chip{font-size:42px;margin-top:56px;align-self:flex-start;color:var(--text)}
#inner{display:flex;flex-direction:column}
.card + .hint + .chip{align-self:center;margin-top:40px}
.photo{position:absolute;left:50%;transform:translateX(-50%);bottom:310px;height:850px;
  -webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent 98%)}
.halo{position:absolute;left:50%;transform:translateX(-50%);bottom:330px;width:900px;height:900px;
  background:radial-gradient(closest-side,rgba(83,195,162,.22),transparent)}
</style></head><body>
<div class="pad fit" id="pad"><div id="inner"></div></div><div class="handle">@maehrtax</div>
<script>
const d = window.DATA || {type:'question',kicker:'QUICK POLL',title:'How many spreadsheets feed your *provision*?',slotHint:'Vote below ↓'};
const p = $('pad');
let h = `${d.kicker?`<div class="kicker">${fmt(d.kicker)}</div>`:''}<h1>${fmt(d.title)}</h1>`;
if (d.text) h += `<div class="txt">${fmt(d.text)}</div>`;
if (d.points) h += `<ul>${d.points.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul>`;
if (d.type==='question') h += `${d.slotHint?`<div class="slothint">${fmt(d.slotHint)}</div>`:''}<div class="slot" style="height:${d.slot||380}px"></div>`;
if (d.type==='answer') h += `<div class="answer">${fmt(d.answer||'↩ Reply to this story')}</div>`;
if (d.type==='teaser') h += (d.image
    ? `<div class="card" style="background-image:url('${d.image}')"></div>`
    : `<div class="card plain"><span>TAX × CODE</span><b>@maehrtax</b></div>`)
  + `<div class="hint">${fmt(d.hint||'New on the profile → @maehrtax')}</div>`;
if (d.cta) h += `<span class="chip">${fmt(d.chip||'💬 DM “TOOL”')}</span>`;
$('inner').innerHTML = h;
if (d.photo) { p.classList.add('withphoto'); document.body.insertAdjacentHTML('afterbegin', `<div class="halo"></div><img class="photo" src="${d.photo}">`); }
</script></body></html>
