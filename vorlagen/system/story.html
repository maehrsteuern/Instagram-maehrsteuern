<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="basis.css"><script src="text.js"></script>
<!-- Story 1080×1920. Typen: info | frage | teaser. Oben 250 px und unten 340 px frei (Instagram-Leisten) -->
<style>
html,body{width:1080px;height:1920px}
body{background:radial-gradient(90% 55% at 50% 42%,var(--bg2) 0%,var(--bg) 70%)}
.pad{position:absolute;left:90px;right:90px;top:250px;bottom:340px;display:flex;flex-direction:column;justify-content:center}
.kicker{font-size:32px}
h1{font-family:var(--serif);font-weight:600;font-size:104px;line-height:1.04;margin:36px 0 0}
.txt{font-size:42px;line-height:1.5;color:var(--text2);margin-top:44px}
ul{list-style:none;padding:0;margin:52px 0 0}
li{font-size:44px;line-height:1.35;margin:0 0 34px;padding-left:64px;position:relative}
li:before{content:"→";position:absolute;left:0;color:var(--gruen);font-family:var(--mono);font-weight:600}
.slot{margin-top:70px;height:360px;border:3px dashed rgba(83,195,162,.45);border-radius:36px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:28px;color:var(--grau);letter-spacing:.15em}
.card{margin-top:60px;height:640px;border-radius:36px;background:center/cover;box-shadow:0 0 80px rgba(83,195,162,.25);border:3px solid var(--gruen)}
.hint{margin-top:44px;font-family:var(--mono);font-size:32px;color:var(--gruen)}
.handle{position:absolute;left:0;right:0;bottom:250px;text-align:center;font-family:var(--mono);font-size:30px;color:var(--grau)}
.chip{font-size:40px;margin-top:56px;align-self:flex-start}
</style></head><body>
<div class="pad" id="pad"></div><div class="handle">@maehrsteuern</div>
<script>
const d = window.DATA || {typ:'frage',kicker:'Kurze Frage',titel:'Welche *Excel-Liste* nervt dich am meisten?'};
const p = $('pad');
let h = `<div class="kicker">${fmt(d.kicker)}</div><h1>${fmt(d.titel)}</h1>`;
if (d.text) h += `<div class="txt">${fmt(d.text)}</div>`;
if (d.punkte) h += `<ul>${d.punkte.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul>`;
if (d.typ==='frage') h += `<div class="slot">STICKER HIER</div>`;
if (d.typ==='teaser') h += `<div class="card" style="background-image:url(${d.bild||'../app_9x16.png'})"></div><div class="hint">${fmt(d.hint||'Jetzt neu im Profil → @maehrsteuern')}</div>`;
if (d.cta) h += `<span class="chip">${fmt(d.chip||'💬 Schreib „TOOL“ per DM')}</span>`;
p.innerHTML = h;
</script></body></html>
