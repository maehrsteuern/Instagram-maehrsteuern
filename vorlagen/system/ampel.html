<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="basis.css"><script src="text.js"></script>
<!-- Ampel-Nahaufnahme für Reels 1080×1920, nachgebaut im Stil der App (nur Beispieldaten). stand: rot | gelb | gruen
     Eigene Themen: kopf, datum, kicker, titel, namen:[5 Prüfpunkte], zeilen:[[farbe,text] …] (sonst Ertragsteuern-Standard) -->
<style>
html,body{width:1080px;height:1920px}
body{background:radial-gradient(110% 60% at 50% 40%,var(--glow) 0%,var(--bg) 68%)}
.kopf{position:absolute;left:70px;right:70px;top:150px;display:flex;align-items:center;gap:26px}
.kopf b{font-family:var(--serif);font-size:46px;font-weight:600}
.kopf span{font-family:var(--mono);font-size:30px;color:var(--grau);letter-spacing:.08em}
.kopf i{font-style:normal;font-family:var(--mono);font-size:26px;letter-spacing:.14em;color:var(--gelb);
  background:rgba(232,176,74,.14);padding:8px 18px;border-radius:10px}
.titel{position:absolute;left:70px;right:70px;top:290px;text-align:center}
.titel .kicker{font-size:30px;margin-bottom:22px}
h1{font-family:var(--serif);font-weight:600;font-size:108px;line-height:1.05;margin:0}
.lampen{position:absolute;left:50%;top:640px;transform:translateX(-50%);display:flex;gap:46px;padding:34px 52px;
  border-radius:120px;background:#101714;border:3px solid #26342D}
.lampe{width:130px;height:130px;border-radius:50%;opacity:.16}
.lampe.an{opacity:1}
.l-rot{background:var(--rot)} .l-rot.an{box-shadow:0 0 70px 14px rgba(224,122,107,.6)}
.l-gelb{background:var(--gelb)} .l-gelb.an{box-shadow:0 0 70px 14px rgba(232,176,74,.6)}
.l-gruen{background:var(--gruen)} .l-gruen.an{box-shadow:0 0 70px 14px rgba(83,195,162,.6)}
.karte{position:absolute;left:60px;right:60px;top:900px;padding:30px 46px;border-radius:26px;background:#141B18;border:3px solid #26342D}
.karte .kicker{font-size:26px;color:var(--grau);margin:10px 0 10px;letter-spacing:.2em}
.zeile{display:flex;align-items:center;gap:26px;padding:24px 0;border-top:2px solid #212C27;font-size:38px}
.zeile:nth-of-type(2){border-top:0}
.punkt{width:26px;height:26px;border-radius:50%;flex:none}
.zeile .name{flex:1}
.zeile .st{font-family:var(--mono);font-size:32px;font-weight:600}
.rot{color:var(--rot)} .gelb{color:var(--gelb)} .gruen{color:var(--gruen)}
.p-rot{background:var(--rot)} .p-gelb{background:var(--gelb)} .p-gruen{background:var(--gruen)}
.fuss{position:absolute;left:0;right:0;top:1580px;text-align:center;font-family:var(--mono);font-size:28px;color:var(--grau);letter-spacing:.12em}
</style></head><body>
<script>
const d = window.DATA || {stand:'rot'};
const STAENDE = {
  rot:   {titel:'2 Punkte\n*kritisch*', farbe:'rot', zeilen:[['gruen','ok'],['rot','Hebesatz fehlt'],['gelb','Satz prüfen'],['gruen','ok'],['rot','nicht gebucht']]},
  gelb:  {titel:'1 Hinweis\n*offen*', farbe:'gelb', zeilen:[['gruen','ok'],['gruen','ok'],['gelb','Satz prüfen'],['gruen','ok'],['gruen','gebucht']]},
  gruen: {titel:'Abschluss-\n*reif.*', farbe:'gruen', zeilen:[['gruen','ok'],['gruen','ok'],['gruen','ok'],['gruen','ok'],['gruen','gebucht']]},
};
const NAMEN = ['Körperschaftsteuer + SolZ','Gewerbesteuer','Latente Steuern','Vorauszahlungen','Steuerrückstellung'];
const s0 = STAENDE[d.stand] || STAENDE.rot;
const s = {...s0, titel: d.titel ?? s0.titel, zeilen: d.zeilen ?? s0.zeilen};
const namen = d.namen ?? NAMEN;
const titel = fmt(s.titel).replace(/class="a"/g, `class="${s.farbe}"`);
document.body.insertAdjacentHTML('beforeend', `
<div class="kopf"><b>${fmt(d.kopf ?? 'Ertragsteuern')}</b><span>${fmt(d.datum ?? 'JA 2025-12-31')}</span><i>DEMODATEN</i></div>
<div class="titel"><div class="kicker">${fmt(d.kicker ?? 'Abschlussreife')}</div><h1>${titel}</h1></div>
<div class="lampen">${['rot','gelb','gruen'].map(f => `<div class="lampe l-${f}${f===s.farbe?' an':''}"></div>`).join('')}</div>
<div class="karte"><div class="kicker">Prüfpunkte</div>${namen.map((n,i) => { const [f,t] = s.zeilen[i];
  return `<div class="zeile"><div class="punkt p-${f}"></div><div class="name">${fmt(n)}</div><div class="st ${f}">${t}</div></div>`; }).join('')}</div>
<div class="fuss">DEMO · BEISPIELDATEN</div>`);
</script></body></html>
