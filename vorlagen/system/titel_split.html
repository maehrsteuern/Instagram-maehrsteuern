<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="basis.css">
<!-- Reel-Titelbild Split (Excel gegen Tool) 1080×1920 – alles Wichtige im mittleren 3:4-Bereich (y 240–1680) -->
<style>
html,body{width:1080px;height:1920px}
body{background:radial-gradient(110% 60% at 50% 45%,var(--glow) 0%,var(--bg) 70%)}
.kopf{position:absolute;left:60px;right:60px;top:270px;text-align:center}
.kopf .kicker{font-size:34px;margin-bottom:22px}
.kopf h1{font-family:var(--serif);font-weight:600;font-size:92px;line-height:1.02;margin:0}
.feld{position:absolute;left:60px;right:60px;height:390px;border-radius:26px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.55)}
.feld img{width:100%;height:100%;object-fit:cover;object-position:top}
.feld.ex{top:560px;border:5px solid var(--rot)}
.feld.ex img{object-position:center 80%}
.feld.ex .lab{top:22px;bottom:auto}
.feld.to{top:1110px;border:5px solid var(--gruen)}
.feld .lab{position:absolute;left:24px;bottom:22px;font-family:var(--serif);font-weight:600;font-size:64px;padding:10px 26px;border-radius:16px}
.ex .lab{background:var(--rot);color:#1a0b08}
.to .lab{background:var(--gruen);color:#06140f}
.vs{position:absolute;left:50%;top:1000px;transform:translate(-50%,-50%);font-family:var(--mono);font-weight:700;font-size:46px;
  background:var(--bg);border:4px solid var(--grau);color:var(--text);width:120px;height:120px;border-radius:50%;display:grid;place-items:center;z-index:2}
.fuss{position:absolute;left:0;right:0;top:1560px;text-align:center}
.fuss .chip{font-size:40px}
</style></head><body>
<div class="kopf"><div class="kicker">Hebesatz 400 → 450</div><h1>Excel <span style="color:var(--rot)">vs.</span> Code</h1></div>
<div class="feld ex"><img src="../../posts/02_2026-10-06_excel_fehler/bausteine/titel_excel.png"><div class="lab">#BEZUG!</div></div>
<div class="vs">VS</div>
<div class="feld to"><img src="../../posts/02_2026-10-06_excel_fehler/bausteine/titel_tool.png"><div class="lab">1,7 s ✓</div></div>
<div class="fuss"><span class="chip">@maehrsteuern</span></div>
</body></html>
